# Public TCP 443 and the legacy TCP 50010 both reach this listener.
server {
    listen 192.168.3.15:443 ssl;
    server_name www.biomatbd.cn;

    ssl_certificate /etc/letsencrypt/live/www.biomatbd.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.biomatbd.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1025m;

    if ($http_host = "www.biomatbd.cn:50010") {
        return 301 https://www.biomatbd.cn$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host www.biomatbd.cn;
        proxy_set_header X-Forwarded-Host www.biomatbd.cn;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        proxy_redirect off;
    }
}
